<!DOCTYPE html>
<html>
<head>
    <title>{{ site.title }}</title>
    <style>
        /* CSS Variables for theming */
        :root {
            /* Light theme colors */
            --bg-color: #ffffff;
            --text-color: #333333;
            --toc-bg: #f9f9f9;
            --toc-border: #cccccc;
            --link-color: #333333;
            --link-hover: #000000;
            --button-bg: #f9f9f9;
            --button-border: #cccccc;
        }
        [data-theme="dark"] {
            /* Dark theme colors - softer for eye comfort */
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --toc-bg: #2a2a2a;
            --toc-border: #444444;
            --link-color: #87ceeb;
            --link-hover: #add8e6;
            --button-bg: #2a2a2a;
            --button-border: #444444;
        }
        /* Base page layout for a Tufte-style reading experience */
        body {
            margin: 0;
            min-height: 100vh;
            line-height: 1.7;
            font-family: Georgia, 'Times New Roman', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .page-shell {
            display: grid;
            grid-template-columns: minmax(220px, 260px) minmax(44rem, 1fr);
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            align-items: start;
        }

        .sidebar {
            position: sticky;
            top: 1.5rem;
            align-self: start;
            padding-right: 1rem;
        }

        .sidebar h1 {
            margin: 0 0 1rem;
            font-size: 1.7rem;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        nav a {
            display: inline-block;
            text-decoration: none;
            color: var(--link-color);
            padding: 0.35rem 0.5rem;
            border-radius: 5px;
        }

        nav a:hover {
            background: var(--toc-bg);
            color: var(--link-hover);
        }

        main {
            max-width: 44rem;
            width: 100%;
            margin: 0 auto;
        }

        .toc-panel {
            border: 1px solid var(--toc-border);
            background: var(--toc-bg);
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-color);
            line-height: 1.6;
            margin-top: 1.5rem;
        }

        .toc-panel h3 {
            margin-top: 0;
            margin-bottom: 0.85rem;
            font-size: 1rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .toc-panel ul {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 0;
        }

        .toc-panel li {
            margin: 0.45rem 0;
        }

        .toc-panel a {
            color: var(--link-color);
            text-decoration: none;
        }

        .toc-panel a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        #theme-toggle {
            display: inline-block;
            margin-top: 1rem;
            background: var(--button-bg);
            border: 1px solid var(--button-border);
            color: var(--text-color);
            padding: 0.5rem 0.85rem;
            cursor: pointer;
            border-radius: 8px;
        }

        #theme-toggle:hover {
            background: var(--toc-bg);
        }

        @media (max-width: 1200px) {
            .page-shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                max-width: 100%;
            }

            nav ul {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
        }

        @media (max-width: 720px) {
            .page-shell {
                padding: 1rem;
            }

            main {
                max-width: 100%;
            }

            nav a {
                padding: 0.4rem 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <aside class="sidebar">
            <h1>{{ site.title }}</h1>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/posts">Posts</a></li>
                    <li><a href="/research">Research</a></li>
                    <li><a href="/open-source">Open Source</a></li>
                    <li><a href="/about">About</a></li>
                </ul>
            </nav>
            <button id="theme-toggle">Toggle Dark Mode</button>
            <div class="toc-panel" id="toc">
                <h3>Contents</h3>
            </div>
        </aside>
        <main>
            {{ content }}
        </main>
    </div>
    <script>
        // Generate Table of Contents for blog posts
        document.addEventListener('DOMContentLoaded', function() {
            const toc = document.getElementById('toc');
            if (!toc) {
                return;
            }

            const headings = document.querySelectorAll('h2, h3, h4');
            if (headings.length > 0) {
                const ul = document.createElement('ul');
                headings.forEach(h => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    const id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                    h.id = id;
                    a.href = '#' + id;
                    a.textContent = h.textContent;
                    li.style.marginLeft = (h.tagName === 'H3' ? '20px' : h.tagName === 'H4' ? '40px' : '0');
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                toc.appendChild(ul);
            } else {
                toc.style.display = 'none';
            }
        });

        // Dark mode toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Load saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            body.setAttribute('data-theme', savedTheme);
        }

        // Toggle theme on button click
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
